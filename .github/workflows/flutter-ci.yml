name: Flutter CI

on:
  push:
    branches:
      - main
      - 'phase*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify lockfile is reproducible
        run: git diff --exit-code -- pubspec.lock

      - name: Test
        run: flutter test --no-pub

      - name: Analyze
        run: dart analyze

      - name: Build Linux release
        run: flutter build linux --release --no-pub
