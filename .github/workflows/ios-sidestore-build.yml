name: Build SideStore IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    # FreshFlag's current FlutterFire/CocoaPods dependency set pulls
    # BoringSSL-GRPC versions that fail under newer Xcode clang with
    # `unsupported option '-G'`. macOS 14 retains Xcode 15.4, which is
    # compatible with this dependency set and is sufficient for iOS 15+.
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify lockfile is reproducible
        run: git diff --exit-code -- pubspec.lock

      - name: Test SideStore profile
        run: flutter test --no-pub --dart-define=FRESHFLAG_SIDESTORE=true

      - name: Analyze
        run: dart analyze

      - name: Verify SideStore capability budget
        shell: bash
        run: |
          set -euo pipefail

          # The zero-fee build intentionally has no entitlements/capabilities
          # that require a paid Apple team. Fail closed if one is introduced.
          if find ios/Runner -maxdepth 1 -name '*.entitlements' -print -quit | grep -q .; then
            echo 'Unexpected iOS Runner entitlements file in SideStore build.' >&2
            exit 1
          fi
          if grep -Eq 'CODE_SIGN_ENTITLEMENTS|SystemCapabilities' ios/Runner.xcodeproj/project.pbxproj; then
            echo 'Unexpected Xcode signing capability in SideStore build.' >&2
            exit 1
          fi

          test "$(/usr/libexec/PlistBuddy -c 'Print :FirebaseMessagingAutoInitEnabled' ios/Runner/Info.plist)" = "false"

      - name: Build unsigned iOS app
        run: >-
          flutter build ios --release --no-codesign --no-pub
          --dart-define=FRESHFLAG_SIDESTORE=true

      - name: Assemble SideStore IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="build/ios/iphoneos/Runner.app"
          OUT="build/sidestore"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          FIREBASE_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/Runner/GoogleService-Info.plist)"
          FCM_AUTO_INIT="$(/usr/libexec/PlistBuddy -c 'Print :FirebaseMessagingAutoInitEnabled' "$APP/Info.plist")"

          test "$BUNDLE_ID" = "com.rpatel2023.freshflag"
          test "$FIREBASE_BUNDLE_ID" = "$BUNDLE_ID"
          test "$FCM_AUTO_INIT" = "false"
          test -f ios/Runner/GoogleService-Info.plist

          # Keep the Personal-Team App ID budget predictable. FreshFlag has no
          # extensions; adding one must be an explicit distribution decision.
          if find "$APP" -type d -name '*.appex' -print -quit | grep -q .; then
            echo 'Unexpected app extension in SideStore IPA.' >&2
            exit 1
          fi

          # FreshFlag initializes Firebase with explicit Dart options. Include
          # the production plist in the final bundle as canonical native iOS
          # configuration for Firebase plugins as well.
          cp ios/Runner/GoogleService-Info.plist "$APP/GoogleService-Info.plist"

          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/FreshFlag.app"

          (
            cd "$OUT"
            zip -qry FreshFlag-unsigned.ipa Payload
          )

          test -s "$OUT/FreshFlag-unsigned.ipa"
          unzip -l "$OUT/FreshFlag-unsigned.ipa" | grep -q 'Payload/FreshFlag.app/Info.plist'
          unzip -l "$OUT/FreshFlag-unsigned.ipa" | grep -q 'Payload/FreshFlag.app/GoogleService-Info.plist'

      - name: Upload SideStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreshFlag-SideStore-IPA
          path: build/sidestore/FreshFlag-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
