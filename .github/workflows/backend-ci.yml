name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'security-tests/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'web-push/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and test
        run: npm test

      - name: Validate web companion JavaScript and manifest
        working-directory: ${{ github.workspace }}
        run: |
          node --check web-push/app.js
          node --check web-push/sw.js
          node -e "JSON.parse(require('fs').readFileSync('web-push/manifest.webmanifest', 'utf8'))"

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: security-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Firestore emulator authorization tests
        run: npm test
